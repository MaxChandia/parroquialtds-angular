<app-navbar/>
    <div class="contactoContainer">
        <h1 color="primary">Contacto</h1>
        <div class="breadcrumb">
            <a routerLink="/">Inicio</a> | Contacto
        </div>

        <div class="contactoSection">
            <div class="contactoInformacion">
                <h2>Datos de Contacto</h2>
                <p>Sra. Marcela Quintela</p>
                <p>+56 552 606216</p>
                <p>tuparroquiainforma&#64;gmail.com</p>
                <h2>Dirección</h2>
                <p>Calle Antilhue 01991 (coviefi)</p>
                <p>Antofagasta, Chile</p>
                <h2>Horarios de Oficina</h2>
                <p>Martes a Sábado: 18:30 a 21:00 hrs.</p>
                <p>Domingo: 10:30 a 14:00 hrs.</p>
            </div>

            <div class="contactoFormulario">
                <form [formGroup]="contactoForm" (ngSubmit)="onSubmit()">
                    <mat-form-field appearance="fill">
                    <mat-label>Nombre</mat-label>
                    <input matInput formControlName="nombre" placeholder="Nombre" />
                    </mat-form-field>

                    <mat-form-field appearance="fill">
                    <mat-label>Correo</mat-label>
                    <input matInput formControlName="mail" placeholder="Correo" />
                    </mat-form-field>

                    <mat-form-field appearance="fill">
                    <mat-label>Mensaje</mat-label>
                    <textarea matInput formControlName="mensaje" placeholder="Mensaje..."></textarea>
                    </mat-form-field>

                    <button mat-raised-button color="primary" type="submit">Enviar</button>
                </form>
            </div>  
        </div>
        <section class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3472.745668364598!2d-70.4092527!3d-23.693163000000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x96afd5bdf8f19db1%3A0xb566bf67bf88dd55!2sLa%20Transfiguraci%C3%B3n%20del%20Se%C3%B1or!5e1!3m2!1ses!2scl!4v1750339116209!5m2!1ses!2scl" width="100%%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
    </div>

<app-footer/>
